model:
  lorem.LoremQ:
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 128
    max_degree: 6
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 4
    lr: false
    initialize_node_features: True
    # exposes bec_z = -(A eps0) d2E/(dr dq). Off elsewhere: it costs a
    # forward-over-reverse pass on top of the forces, so only this variant,
    # which actually supervises it, pays for it.
    predict_bec: True
