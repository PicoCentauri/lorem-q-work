train: "data/train"
valid: "data/valid"
test_datasets:
  test: ["data/test", true]
  test_sweep: ["data/test_sweep", true]
seed: 42
batcher:
  batch_size: 16
  coarse_strategy: powers_of_4
  size_strategy: powers_of_4
  fine_strategy: powers_of_4
# 450 epochs / 22 warmup, matching sr-450ep/ so the whole sweep is compared
# at a converged, gradient-update-matched budget rather than at 200 epochs
# where sr/ and sr-wf/ sit.
#
# An epoch here is 2.25x smaller (4,860 frames vs 10,931), so sr/'s 200 epochs
# is 64,800 updates against razor's 145,700. This run scales both the total
# and the warmup by that factor, so the cosine schedule has the same shape in
# update space:
#
#   450 epochs x 324 batches = 145,800 updates  (razor: 145,747)
#    22 epochs x 324 batches =   7,128 warmup   (razor:   7,287)
#
# Convention follows arXiv 2602.22931 SI S-II: compare models at similar
# numbers of gradient updates, GU = epochs x dataset size / batch size.
# Everything else is identical to sr/, so the pair isolates training length.
# The energy axis. Same work-function share as sr-wf0.05-450ep/ (23% vs
# 26%), but energy moves from 0.2% of the loss to 13.6% -- so the pair
# isolates energy weight rather than confounding it with the work function.
#
# Rationale for testing it at all: forces constrain dE/dr and say nothing
# about dE/dq, so in a charge-conditioned model the energy term is the only
# thing besides the work function itself that constrains the charge
# direction. That argument does not apply to a plain MLIP, where energy at
# 0.2% of the loss still reaches R2 99.9%.
loss_weights: {"energy": 100.0, "forces": 1.0, "work_function": 0.1}
checkpointers: full
optimizer: muon
valid_every_epoch: 2
decay_style: warmup_cosine
warmup_epochs: 22
start_learning_rate: 2e-4
gradient_clip: 1.0
max_epochs: 450
benchmark_pipeline: True
use_wandb: False
default_matmul_precision: "float32"
worker_count: 4
