train: "data/train"
valid: "data/valid"
test_datasets:
  test: ["data/test", true]
seed: 42
batcher:
  batch_size: 16
  coarse_strategy: powers_of_4
  size_strategy: powers_of_4
  fine_strategy: powers_of_4
# 100 : 1 : 0.05 -- razor's proven triple, not the 150 : 1 : 0.15 this
# folder first used. That diverged: both runs hit "loss became NaN at
# step=8280" at LR 1.6e-05, still inside warmup. Diverging at a *low* learning
# rate points at the loss scale rather than the step size, and the data was
# ruled out first -- zero non-finite labels, max|F| 14.33 eV/A with 2 frames
# over 10, bec_z bounded at 1.07 e.
#
# 150 : 1 : 0.15 was the most aggressive weighting used anywhere here on both
# axes at once. ../razor/README.md warns about the 0.15 specifically: the
# untrained dE/dq starts around -2..-18 V against labels of +3..+7, so that
# term begins at ~99% of the loss, and razor's sweep moved to 0.05 because
# 0.15 cost 1.9x on energy and 1.7x on forces. Pairing it with the largest
# energy weight used in this project was the mistake.
#
# The cost of the safe choice: shares are E 16.4 / F 78.6 / W 5.0, so the
# work function gets ~5% rather than the 12.1% razor's tuned split gives. That
# is the price of a weighting proven to train on this model. Raise W once this
# is known to be stable -- with the a100 queue ~4 days deep, a second
# divergence is expensive.
loss_weights: {"energy": 100.0, "forces": 1.0, "work_function": 0.05}
checkpointers: full
optimizer: muon
valid_every_epoch: 2
decay_style: warmup_cosine
# 26, matched on gradient updates: razor's 10 epochs = 7,290 updates, and at
# 276 batches/epoch that is 26.4 here.
warmup_epochs: 26
start_learning_rate: 2e-4
gradient_clip: 1.0
# 4,138 train frames at 15 real structures per batch = 276 batches/epoch, so
# 800 epochs = 220,800 gradient updates -- within 1% of ../razor/'s l2c8
# 300-epoch budget (729 x 300 = 218,700). Epochs are not comparable across
# folders; updates are.
max_epochs: 800
benchmark_pipeline: True
use_wandb: False
default_matmul_precision: "float32"
worker_count: 4
