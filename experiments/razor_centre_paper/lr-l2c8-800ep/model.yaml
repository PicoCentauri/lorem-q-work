model:
  lorem.LoremQ:
    # d64 l2 c8 -- the configuration that worked best per unit cost in
    # ../razor/, and byte-identical to ../cpmace/ and ../natcomm2025/, so all
    # four datasets read across at fixed model.
    # lr: true, max_degree_lr 0 -- monopole Ewald, as in ../razor/lr/. Note
    # these frames are pbc = T T F slabs, so this uses the 2D-mixed Ewald
    # path rather than the 3D one ../cpmace/ and ../natcomm2025/ exercise.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 8
    lr: true
    initialize_node_features: True
