model:
  lorem.LoremQ:
    # d64 l2 c8 -- the configuration that worked best per unit cost in
    # ../razor/, and byte-identical to ../cpmace/ and ../natcomm2025/, so all
    # four datasets read across at fixed model.
    # sr plus bec_z as a third derivative target. predict_bec exposes
    # -(A eps0) d2E/(dr dq); it costs a forward-over-reverse pass on top of
    # the forces, so it is on only for the variant that supervises it.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 8
    lr: false
    initialize_node_features: True
    predict_bec: True
