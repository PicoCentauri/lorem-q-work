model:
  lorem.LoremQ:
    # d64 l2 c8, the same architecture as the last razor pair, so results
    # transfer read-across. LoremQ because this trains on the work function.
    # lr: true, max_degree_lr 0 -- monopole Ewald, as in ../razor/. Note this
    # system is fully periodic (pbc = T T T), unlike razor's slab (T T F), so
    # the Ewald sum here is 3D rather than the 2D-mixed variant. Worth watching:
    # the long-range head has not been exercised in 3D anywhere in this repo.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 8
    lr: true
    initialize_node_features: True
