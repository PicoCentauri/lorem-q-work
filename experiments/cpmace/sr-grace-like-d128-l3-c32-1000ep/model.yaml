model:
  lorem.LoremQ:
    # "GRACE-like" within LOREM's existing config surface -- no ported code.
    # Mapped from the GRACE_2LAYER preset in grace-tensorpotential
    # (tensorpotential/potentials/presets.py):
    #
    #   GRACE-2L                          -> LOREM
    #   lmax = (3, 3)                     -> max_degree: 3
    #   n_rad_max = (32, 48)              -> num_spherical_features: 32
    #   embedding_size = 128              -> num_features: 128
    #   two layers (local + equivariant   -> num_message_passing: 1
    #     message pass)
    #
    # The point is the *shape* of the capacity, not its size. GRACE spends its
    # budget on many radial/equivariant channels at moderate angular
    # resolution; LOREM's defaults do the opposite (l=6 with c=4). razor's size
    # sweep already found channels beat degrees at fixed cost, and cp-MACE
    # reaches 16.5 meV/A with 128x0e + 128x1o -- l <= 1, 128 channels. This
    # config gives (1+3+5+7) x 32 = 512 equivariant numbers per atom, matching
    # cp-MACE's 512, against the d64 l2 c8 control's 72.
    #
    # cutoff stays 5.0 rather than GRACE's default 6.0, so this stays
    # comparable to every other run here and to cp-MACE, which also used 5.0.
    # num_radial stays 16: GRACE parameterises the radial part differently
    # (8 Chebyshev functions expanded by an MLP to n_rad_max), which is not
    # expressible here and is a separate question.
    #
    # WHAT THIS DOES NOT TEST: GRACE reaches body order 4 by stacking pairwise
    # products (A -> AA -> AAA -> AAAA). LOREM reaches roughly nu=2 per
    # message-passing step and has no equivalent, so this run tests the
    # capacity-shape half of the hypothesis only. The body-order half needs
    # the ProductFunction port -- feasible (GRACE's couplings.py is pure
    # numpy/sympy and its forward pass is gather + multiply + segment_sum),
    # but that is a code change, not a config.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 128
    max_degree: 3
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 32
    lr: false
    initialize_node_features: True
