seed: 1
cutoff: 6.0

data:
  filename: data/train.xyz
  test_filename: data/valid.xyz
  # Every frame is C70 H89 N Ni O46, so the per-element least-squares fit is
  # rank-deficient in the individual E0s -- it can only resolve the overall
  # offset. That is all we need: it moves E/atom off -6.4 eV so the network
  # learns a residual rather than a large constant.
  reference_energy: auto
  save_dataset: True
  extra_components:
    # supplies total_charge (a model INPUT, read by FiLM) and the
    # work_function label. Resolved via tensorpotential.extra.extra_data_builders.
    TotalChargeDataBuilder:
      fit_work_function: True

potential:
  preset: GRACE_2LAYER_FILM
  param_dtype: float64
  kwargs:
    # GRACE_2LAYER "small" settings, plus the FiLM block
    lmax: [4, 3]
    max_order: 4
    indicator_lmax: 1
    n_rad_max: [32, 32]
    prod_func_n_max: [32, 32]
    n_mlp_dens: 12
    n_rad_base: 8
    # --- charge conditioning ---
    charge_hidden_layers: [16]
    charge_activation: silu
    # raw total charge, matching LOREM so the two are comparable. q spans only
    # [-2.31, -1.26] here and every frame has the same cell and composition, so
    # per_atom / per_area would just rescale by a constant.
    charge_normalize: none

fit:
  loss:
    energy: { weight: 16, type: square }
    forces: { weight: 32, type: square }
    extra_components:
      # resolved via tensorpotential.extra.extra_losses
      WeightedSSEWorkFunctionLoss: { weight: 10, type: square }

  # emits work_function = dE/dq from the same tape as the forces
  train_function: ComputeBatchEnergyForcesCharge
  compute_function: ComputeStructureEnergyForcesVirialCharge

  # The gracemaker wizard's Adam block. Note the learning rate lives in
  # opt_params -- a bare `fit: learning_rate:` is silently ignored
  # (cli/train.py reads fit_config["opt_params"]["learning_rate"]) and you get
  # the fallback {learning_rate: 0.01, amsgrad: True} instead, with no EMA and
  # no gradient clipping.
  optimizer: Adam
  opt_params: {
    learning_rate: 0.008,
    use_ema: True,
    ema_momentum: 0.99,
    weight_decay: null,
    clipnorm: 1.0,
  }

  # cosine_decay is what `gracemaker -t` emits for Adam (wizard.py picks
  # reduce_on_plateau only when loss-weight switching is on, because switching
  # is implemented for CustomReduceLROnPlateau alone). The library itself has
  # no default: with neither `scheduler` nor the legacy
  # `learning_rate_reduction` present, create_lr_scheduler returns None and the
  # LR stays constant.
  #
  # `minimum_learning_rate`, NOT `minimal_learning_rate`: the wizard emits the
  # latter for the cosine branch but read_decay_kwargs only ever looks up the
  # former, so the wizard's own lr/12 is silently dropped in favour of the
  # 1e-4 default. Upstream typo -- spelling it correctly here so it applies.
  scheduler: cosine_decay
  scheduler_params: { minimum_learning_rate: 0.00066667 }   # = lr / 12

  target_total_updates: 20000   # 984 frames / batch 16 = 62 updates/epoch -> ~320 epochs
  batch_size: 16                # 16 x 207 atoms = 3312 atoms/batch
  test_batch_size: 32

  jit_compile: True
  eval_init_stats: True
  checkpoint_freq: 5
  progressbar: False
  train_shuffle: True

  train_max_n_buckets: auto
  test_max_n_buckets: auto
  auto_bucket_max_padding: 0.3
