seed: 1
cutoff: 6.0

data:
  # shared with the parent -- ../prepare.py writes these once
  filename: ../data/train.xyz
  test_filename: ../data/valid.xyz
  reference_energy: auto
  save_dataset: True
  extra_components:
    TotalChargeDataBuilder:
      fit_work_function: True

potential:
  preset: GRACE_2LAYER_FILM
  # CHANGED from the first run (was float64). This is gracemaker's own default
  # (wizard.py:285) and means mixed precision: parameters FP32, geometry FP64.
  # The first run sat at 79.7/81.9 GB, i.e. 97% of the card, with no headroom
  # for a larger batch or the BEC forward-over-reverse pass. On an A100, FP64
  # is 9.7 TFLOPS against FP32's 19.5, and tensorpotential disables TF32, so
  # expect ~1.3-1.8x -- not a clean 2x, since geometry stays FP64.
  param_dtype: float32
  kwargs:
    lmax: [4, 3]
    max_order: 4
    indicator_lmax: 1
    n_rad_max: [32, 32]
    prod_func_n_max: [32, 32]
    n_mlp_dens: 12
    n_rad_base: 8
    charge_hidden_layers: [16]
    charge_activation: silu
    charge_normalize: none

fit:
  # CHANGED from the first run (was 16 : 32 : 10, square). Those gracemaker
  # defaults left the energy holding 0.10% of the loss -- effectively
  # untrained, the same failure ../../cpmace/ diagnosed for cp-MACE's own
  # 1:100:10 weights.
  #
  # `huber` is gracemaker's own default loss type (wizard.py:271) and the
  # weights are derived FOR it. That derivation is not optional: huber does not
  # scale the three targets equally, because delta=0.01 sits above the energy's
  # error scale (~1.2e-3, so entirely quadratic, huber = square/2 exactly) but
  # below the force and work-function scales (~2.1e-2 and ~3.3e-2, mostly
  # linear, shrunk 4-5x). Mean loss per unit weight, huber/square:
  #     energy 0.500   forces 0.241   work function 0.198
  # So huber shrinks the noisy targets far more than the clean one, and keeping
  # the square-derived weights would silently near-double the energy share:
  #     1000 : 16 : 1  square -> E 15.5% / F 73.4% / W 11.1%
  #     1000 : 16 : 1  huber  -> E 28.1% / F 64.0% / W  7.9%
  #
  # At delta 0.01 these give E 16.3% / F 74.5% / W 9.2%, against razor's tuned
  # triple of 16.4 / 78.6 / 5.0 -- razor's energy share with roughly double the
  # work-function share.
  #
  # The weights are delta-dependent (holding shares fixed, the energy weight
  # runs 271 -> 466 -> 707 as delta goes 0.005 -> 0.01 -> 0.02), so the two must
  # be quoted and changed together.
  #
  # NOTE this is one iteration of a fixed point: raising the energy weight
  # lowers the energy error, which lowers its realised share. Expect the
  # retrained model to land somewhat under 16%.
  loss:
    energy: { weight: 500, type: huber, delta: 0.01 }
    forces: { weight: 16, type: huber, delta: 0.01 }
    extra_components:
      # delta given explicitly: the wizard only applies its delta to energy and
      # forces, and WeightedSSEWorkFunctionLoss defaults to 0.1, which for
      # ~0.033 V errors would be fully quadratic -- huber in name only.
      WeightedSSEWorkFunctionLoss: { weight: 1, type: huber, delta: 0.01 }

  train_function: ComputeBatchEnergyForcesCharge
  compute_function: ComputeStructureEnergyForcesVirialCharge

  optimizer: Adam
  opt_params: {
    learning_rate: 0.008,
    use_ema: True,
    ema_momentum: 0.99,
    weight_decay: null,
    clipnorm: 1.0,
  }
  scheduler: cosine_decay
  scheduler_params: { minimum_learning_rate: 0.00066667 }   # = lr / 12

  target_total_updates: 20000   # 62 updates/epoch -> 323 epochs, as run 1
  batch_size: 16
  # deliberately NOT the wizard's 4*batch_size = 64: run 1 peaked at 97% of an
  # 80 GB card. float32 params should relieve that, but raising the eval batch
  # 2x at the same time is how you find out with an OOM 30 epochs in.
  test_batch_size: 32

  jit_compile: True
  eval_init_stats: True
  checkpoint_freq: 5
  progressbar: False
  train_shuffle: True

  train_max_n_buckets: auto
  test_max_n_buckets: auto
  auto_bucket_max_padding: 0.3
