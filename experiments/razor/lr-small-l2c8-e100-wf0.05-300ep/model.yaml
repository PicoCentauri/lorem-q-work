model:
  lorem.LoremQ:
    # d64 l2 c8 -- the fourth corner of the size 2x2. sr-small-l2 (l2, c16) and
    # sr-small-l3 (l3, c8) were matched on parameter count, so max_degree and
    # num_spherical_features moved together and neither effect was isolated.
    # Against those two this separates both: channels at fixed l=2 (vs l2c16)
    # and degree at fixed c=8 (vs l3c8). Cheapest cell of the grid, 8 x 615 =
    # 4920 CG ops against l2c16's 9840.
    # lr: true with max_degree_lr 0 -- monopole Ewald, as in ../lr/. Note the
    # long-range block updates only the scalar features P: nodes_spherical is
    # never reassigned there, and at max_degree_lr 0 the equivariant branch
    # degenerates to a per-channel scalar rescaling of S. So this measures the
    # monopole head only -- the setting in which lr beat sr on forces.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 8
    lr: true
    initialize_node_features: True
