model:
  lorem.LoremQ:
    # Small model, angular budget spent on channels rather than degrees.
    # max_degree 6 -> 2 collapses the CG cost ~40x (175 valid (l1,l2,l3) paths
    # -> 15), which is the dominant forward-pass cost; num_features 128 -> 64
    # cuts parameters ~4x, since Update and RadialCoefficients go as d^2. The
    # channels bought back (4 -> 16) are nearly free -- s is linear in the CG
    # kernel, and it is being spent in the place that just got 40x cheaper.
    # Net ~300k parameters against sr/'s 1.16M, ~3% of the CG work.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 16
    lr: false
    initialize_node_features: True
