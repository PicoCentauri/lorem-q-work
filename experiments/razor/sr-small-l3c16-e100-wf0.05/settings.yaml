train: "data/train"
valid: "data/valid"
test_datasets:
  test: ["data/test", true]
  test_sweep: ["data/test_sweep", true]
seed: 42
batcher:
  batch_size: 16
  coarse_strategy: powers_of_4
  size_strategy: powers_of_4
  fine_strategy: powers_of_4
# 100:1:0.05 -- the sweep's outcome, identical to sr-e100-wf0.05/, which is
# therefore the exact control for the size change: same loss, same data, only
# the model differs. Shares E 20.1%, F 67.8%, W 12.1% (from label variances,
# so model-independent).
#
# From the four-run sweep: energy at 100 was the only setting to beat the
# no-work-function baseline on energy (0.806 vs sr's 0.855), and force error
# tracks the force share of the loss (99.7% -> 23.5, 73.6% -> 32.6,
# 60.5% -> 33.7, 48.2% -> 40.6 meV/A), which is why the work function sits at
# 0.05 rather than 0.1. Above ~12% the work-function curve is flat-to-falling:
# 0.05 gave 0.1085 V, tripling it to 0.15 gave a *worse* 0.1214.
loss_weights: {"energy": 100.0, "forces": 1.0, "work_function": 0.05}
checkpointers: full
optimizer: muon
valid_every_epoch: 2
decay_style: warmup_cosine
warmup_epochs: 10
start_learning_rate: 2e-4
gradient_clip: 1.0
max_epochs: 200
benchmark_pipeline: True
use_wandb: False
default_matmul_precision: "float32"
worker_count: 4
