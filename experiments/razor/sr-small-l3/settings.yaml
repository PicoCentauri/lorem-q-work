train: "data/train"
valid: "data/valid"
test_datasets:
  test: ["data/test", true]
  test_sweep: ["data/test_sweep", true]
seed: 42
batcher:
  batch_size: 16
  coarse_strategy: powers_of_4
  size_strategy: powers_of_4
  fine_strategy: powers_of_4
# TODO: energy/force weights stay at the house 0.5/0.5 for now so sr/ is an
# exact control for the size change. Once the sr-wf0.05 / sr-e100-wf0.1
# sweep settles the work-function weight, add it here -- the loss shares
# come from label variances, so they carry over unchanged to a smaller
# model, but the achievable work-function RMSE may not.
loss_weights: {"energy": 0.5, "forces": 0.5}
checkpointers: full
optimizer: muon
valid_every_epoch: 2
decay_style: warmup_cosine
warmup_epochs: 10
start_learning_rate: 2e-4
gradient_clip: 1.0
max_epochs: 200
benchmark_pipeline: True
use_wandb: False
default_matmul_precision: "float32"
worker_count: 4
