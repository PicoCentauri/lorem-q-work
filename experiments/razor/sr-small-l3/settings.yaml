train: "data/train"
valid: "data/valid"
test_datasets:
  test: ["data/test", true]
  test_sweep: ["data/test_sweep", true]
seed: 42
batcher:
  batch_size: 16
  coarse_strategy: powers_of_4
  size_strategy: powers_of_4
  fine_strategy: powers_of_4
# Same weights as sr-wf0.05/, which makes that run the exact control for the
# size change -- identical loss, identical data, only the model differs.
# (sr/ is no longer the control now that the work function is a target here.)
#
# 0.05 is provisional: it is the sweep's mid point, chosen so the work
# function is 26.2% of the loss rather than sr-wf/'s 51.6%. Revisit once
# sr-wf0.05 / sr-e100-wf0.1 land. The shares come from label variances
# (E 0.00140, F 0.47330, W 1.68757 on razor_train) so they are identical for
# a smaller model -- but the achievable work-function RMSE may not be, which
# is part of what these runs measure.
loss_weights: {"energy": 0.5, "forces": 0.5, "work_function": 0.05}
checkpointers: full
optimizer: muon
valid_every_epoch: 2
decay_style: warmup_cosine
warmup_epochs: 10
start_learning_rate: 2e-4
gradient_clip: 1.0
max_epochs: 200
benchmark_pipeline: True
use_wandb: False
default_matmul_precision: "float32"
worker_count: 4
