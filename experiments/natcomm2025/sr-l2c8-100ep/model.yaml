model:
  lorem.LoremQ:
    # d64 l2 c8 -- the same architecture as the last ../razor/ and ../cpmace/
    # pairs, so the three datasets read across at fixed model.
    # short-range control for the lr run beside it: byte-identical apart from
    # the lr flag, so the pair isolates the Ewald head.
    cutoff: 5.0
    max_degree_lr: 0
    num_features: 64
    max_degree: 2
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 8
    lr: false
    initialize_node_features: True
